# Shared SFT recipe for every benchmark (the published scripts/train.sh defaults).
# Benchmark files extend this with `_base_: base.yaml`; anything here can be
# overridden on the command line, e.g. `--per_device_train_batch_size 4`.
# Dataset / pipeline defaults (cameras, history window, augmentation, ...) come
# from simplememvla/benchmarks/<name>.py unless set under `data:`.

model:
  backbone_model_name_or_path: ${BACKBONE:-Qwen/Qwen3.5-4B}
  attn_implementation: flash_attention_2
  dtype: bfloat16
  model_max_length: 8192
  dit_hidden_size: 2048
  dit_depth: 16
  dit_num_heads: 16
  dit_mlp_ratio: 3.5
  timestep_beta_alpha: 1.5
  timestep_beta_beta: 1.0
  action_loss_weight: 1.0
  vl_loss_weight: 1.0
  use_proprio: true
  state_dropout_prob: 0.0

training:
  deepspeed: ./configs/zero2.json
  save_steps: 3000
  save_total_limit: 3
  warmup_steps: 1000
  backbone_lr: 5.0e-6
  action_head_lr: 5.0e-5
  weight_decay: 1.0e-8
  lr_scheduler_type: cosine_with_min_lr
  lr_scheduler_kwargs: {min_lr_rate: 0.1}
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  optim: adamw_torch
  bf16: true
  tf32: true
  gradient_checkpointing: true
  dataloader_num_workers: 32
  report_to: wandb
  logging_steps: 10
  log_level: info
  seed: 429
  resume: "false"   # false | true | auto | <checkpoint dir>
