# E2-ckptvlm: + memory cache, adaLN fusion (main). VLM = released simplememvla_robomme backbone (see base_ckptvlm.yaml).
_base_: base_ckptvlm.yaml

model:
  use_memory: true
  mem_fusion: adaln_add

data:
  mem_feature_dir: ${DATA_HOME:-/mnt/cpfs/heping/SimpleMemVLA-data}/features/robomme_vit_merger_front

training:
  run_name: robomme_small_E2_ckptvlm
  output_dir: ./checkpoints/mem/robomme_small_E2_ckptvlm
