# Variant of base.yaml whose frozen VLM is the released simplememvla_robomme backbone
# (DiT and memory still from scratch). Its global statistics span more episodes
# than the public train set; this does not identify its training membership or
# prove evaluation overlap. Kept to measure how much
# the fine-tuned VLM matters (E*_ckptvlm vs E*).
# Paths follow DATA_HOME (default /mnt/cpfs/heping/SimpleMemVLA-data).
_base_: ../base.yaml

model:
  backbone_model_name_or_path: ${DATA_HOME:-/mnt/cpfs/heping/SimpleMemVLA-data}/checkpoints/simplememvla_robomme
  init_from_checkpoint: ${DATA_HOME:-/mnt/cpfs/heping/SimpleMemVLA-data}/checkpoints/simplememvla_robomme
  init_modules: [backbone]
  freeze_backbone: true
  condition_source: prompt
  vl_loss_weight: 0.0
  # DiT shape = the released recipe (fresh weights).
  dit_hidden_size: 2048
  dit_depth: 16
  dit_num_heads: 16
  dit_mlp_ratio: 3.5
  use_memory: false
  mem_frame_pool: 4
  mem_hidden_size: 1024
  mem_depth: 4
  mem_num_heads: 16
  mem_mlp_ratio: 4.0
  mem_num_queries: 16
  mem_compressor_depth: 2
  mem_fusion: adaln_add
  mem_dropout_prob: 0.0

data:
  benchmark: robomme
  root: ${DATA_HOME:-/mnt/cpfs/heping/SimpleMemVLA-data}/datasets/yinchenghust/robomme_lerobot
  episodes_file: ${DATA_HOME:-/mnt/cpfs/heping/SimpleMemVLA-data}/splits/robomme_small_train.txt
  val_episodes_file: ${DATA_HOME:-/mnt/cpfs/heping/SimpleMemVLA-data}/splits/robomme_small_val.txt
  # Fresh DiT: normalise with this dataset's own statistics, not the checkpoint's.
  stats_path: ${DATA_HOME:-/mnt/cpfs/heping/SimpleMemVLA-data}/datasets/yinchenghust/robomme_lerobot/meta/stats.json
  single_frame: true
  image_aug: false
  mem_window_sec: 60.0
  mem_fps: 2.0

training:
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 1   # launch_memcache.sh sets it so global batch = 64
  # From scratch: the released recipe's DiT lr / warmup, and twice the old step budget.
  max_steps: 30000
  warmup_steps: 1000
  backbone_lr: 0.0
  action_head_lr: 5.0e-5
  memory_lr: 1.0e-4
  save_steps: 5000
  save_total_limit: 2
  eval_strategy: steps
  eval_steps: 1000
  eval_max_batches: 50
  gradient_checkpointing: false
  dataloader_num_workers: 16
